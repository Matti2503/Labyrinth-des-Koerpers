<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Leitungsbahnen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leitungsbahnen">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="paper"></div>
<button id="opt" aria-label="Einstellungen öffnen">
  <svg viewBox="0 0 28 28" fill="none" stroke="#2B4A8B" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="14" cy="14" r="5"/>
    <path d="M14 2.5v3.5M14 22v3.5M2.5 14h3.5M22 14h3.5M6 6l2.5 2.5M19.5 19.5L22 22M22 6l-2.5 2.5M8.5 19.5L6 22"/>
  </svg>
</button>
<main id="app"></main>
<script src="gamedata.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      reg.addEventListener('updatefound', () => {
        const neu = reg.installing;
        neu && neu.addEventListener('statechange', () => {
          if (neu.state === 'installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
      reg.update();
    }catch(e){}
  });
}
</script>
</body>
</html>
